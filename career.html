<!DOCTYPE html>
<html lang="ja">
<head>

<body>
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker">Career</p>
        <h1>ダナンから、<br>日本品質の施工BIMを。</h1>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <p class="lede" style="color:rgba(247,244,238,.7);margin-bottom:32px">勤務地はベトナム・ダナン（一部リモート可）。日本案件に、直接関わります。</p>
        <div class="jobs">
          <article class="job">
            <div>
              <h3>BIM Modeler（Revit）</h3>

            </div>
            <a class="btn btn-ghost" href="contact.html">応募する</a>
          </article>

            <div>

            </div>
            <a class="btn btn-ghost" href="contact.html">応募する</a>
          </article>

            <div>
              <h3>Project Manager（BIM）</h3>
              <p>1名。工程、要件、日本側との窓口。</p>
            </div>
            <a class="btn btn-ghost" href="contact.html">応募する</a>
          </article>
        </div>
        <div class="prose" style="margin-top:40px">
          <p>建築・建設の経験、Revit実務1年以上、基礎英語、N1 / N2 歓迎。成長期の会社で、日本品質の訓練と案件に関わりたい人を求めています。</p>
        </div>
      </div>
